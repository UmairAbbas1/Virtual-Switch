# Virtual Switch config file. Lines are "<setting> <value>", # starts a comment.
# Send SIGHUP to the switch to reload this file without restarting.

rate 0              # frames per second each port may send, 0 = unlimited
weights 5 3 1       # weighted round robin for high, normal, low priority
max_wait_ms 200     # a low/normal frame waiting this long is sent next (no starvation)
aging 60            # seconds before an unused MAC is removed
port_max_macs 8     # port security: more MACs than this shuts the port down
wait_seconds 5      # how long an extra host waits for a free port
mac_table_size 1024 # most MACs in the table, oldest evicted first (startup only)
log_file switch.log # where the logger thread writes (startup only)
trunk -1            # trunk port number, -1 = no trunk

# vlan <port> <vlan>, ports not listed are in VLAN 1
vlan 0 1
vlan 1 1
